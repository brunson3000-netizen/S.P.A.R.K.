[package]
name = "spark-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "S.P.A.R.K. canonical deterministic core: bounded IDs/tags, scopes, authority, definition-identity activation, StateCell, logical clock, semantic-key scheduler, random addresses, canonical timeline ingress."

[dependencies]
# "pure" disables blake3's optional C/assembly SIMD backends so the build
# never requires a target C toolchain (e.g. an Android NDK clang for
# cross-checks) - see the dependency rationale in the Phase-1 report.
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }

[lints.rust]
unsafe_code = "forbid"
